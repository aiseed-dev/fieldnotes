[project]
name = "fieldnotes"
version = "0.0.1"
description = "Daily observation records for a natural-farming field: align, segment (SAM 3.1), describe (Muse Spark / Glimmer), verify (farmer + Muse Voice Transcribe)."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "openai>=3",
  "meta-sam-parser>=0.1",
  "pillow",
  "numpy",
  "pyyaml",
  "pillow-heif",
  "httpx",
  "av",  # decodes the phone's voice recordings (voice.py)
  "flet[all]==1.0.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fieldnotes = "fieldnotes.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
